services:
  mysql:
    image: mysql:8.4
    container_name: reeldock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: reeldock
      MYSQL_USER: reel_user
      MYSQL_PASSWORD: reel_bay_47
    ports:
      - "3308:3306"
    volumes:
      - reeldock_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  reeldock_mysql_data:
