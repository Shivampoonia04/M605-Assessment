<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="3" dy="3" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#888" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="920" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#444">Entity Relationship Diagram - ReelDock Kit Desk</text>

