  <text x="542" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">= Zero or more, Optional</text>
  <text x="542" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">= Many</text>

