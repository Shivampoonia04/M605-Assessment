  <text x="258" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Action</text>
  <ellipse cx="370" cy="102" rx="48" ry="22" fill="#7ea3c7" stroke="#4d6478" filter="url(#shadow)"/>
  <text x="370" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff">Attribute</text>
  <g stroke="#333" fill="none" stroke-width="1.6">
    <line x1="470" y1="86" x2="530" y2="86"/>
    <line x1="500" y1="78" x2="500" y2="94"/>
    <line x1="470" y1="102" x2="512" y2="102"/>
    <circle cx="520" cy="102" r="7"/>
    <polyline points="512,96 530,102 512,108"/>
    <line x1="470" y1="122" x2="512" y2="122"/>
    <polyline points="512,116 530,122 512,128"/>
